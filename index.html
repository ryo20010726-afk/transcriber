<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ローカル文字起こし</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3347;
    --accent: #6c8fff;
    --accent2: #a78bfa;
    --success: #34d399;
    --warn: #fbbf24;
    --danger: #f87171;
    --text: #e2e8f0;
    --text2: #8892aa;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', 'Hiragino Sans', sans-serif;
    min-height: 100vh;
    padding: 20px 16px 60px;
  }
  header { text-align: center; margin-bottom: 24px; }
  header h1 {
    font-size: 22px; font-weight: 700;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  header p { font-size: 13px; color: var(--text2); margin-top: 4px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 14px;
  }
  .card-title {
    font-size: 13px; font-weight: 600; color: var(--text2);
    text-transform: uppercase; letter-spacing: 0.08em;
    margin-bottom: 12px;
  }
  .model-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .model-btn {
    flex: 1; min-width: 120px;
    background: var(--surface2);
    border: 2px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 10px 12px;
    cursor: pointer;
    text-align: left;
    transition: border-color 0.2s;
  }
  .model-btn.selected { border-color: var(--accent); }
  .model-btn .model-name { font-size: 14px; font-weight: 600; }
  .model-btn .model-desc { font-size: 11px; color: var(--text2); margin-top: 3px; }
  .file-drop-zone {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 28px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }
  .file-drop-zone:hover {
    border-color: var(--accent);
    background: rgba(108,143,255,0.05);
  }
  .file-drop-zone span { font-size: 32px; display: block; margin-bottom: 8px; }
  .file-drop-zone p { font-size: 14px; color: var(--text2); }
  input[type="file"] { display: none; }
  #fileList { list-style: none; margin-top: 12px; }
  #fileList li {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
    display: flex; align-items: center; gap: 10px;
  }
  .file-info { flex: 1; min-width: 0; }
  .file-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file-meta { font-size: 11px; color: var(--text2); margin-top: 2px; }
  .file-delete {
    background: none; border: none; color: var(--text2);
    font-size: 16px; cursor: pointer; padding: 2px 6px;
    border-radius: 4px; transition: color 0.2s;
  }
  .file-delete:hover { color: var(--danger); }
  .file-controls { display: flex; gap: 8px; margin-top: 10px; }
  .btn-sm {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 13px;
    padding: 8px 14px; cursor: pointer;
  }
  .btn-run {
    width: 100%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; border-radius: var(--radius);
    color: #fff; font-size: 16px; font-weight: 600;
    padding: 16px; cursor: pointer; margin-top: 8px;
    transition: opacity 0.2s;
  }
  .btn-run:disabled { opacity: 0.4; cursor: not-allowed; }
  .progress-wrap { display: none; margin-top: 12px; }
  .progress-wrap.show { display: block; }
  .progress-bar-bg { background: var(--surface2); border-radius: 99px; height: 8px; overflow: hidden; }
  .progress-bar-fill {
    height: 100%; border-radius: 99px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    width: 0%; transition: width 0.4s;
  }
  .progress-label { font-size: 12px; color: var(--text2); margin-top: 5px; text-align: center; }
  .result-card {
    display: none; background: var(--surface);
    border: 1px solid var(--success);
    border-radius: var(--radius); padding: 18px; margin-top: 14px;
  }
  .result-card.show { display: block; }
  .result-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .result-title { font-size: 13px; font-weight: 600; color: var(--success); }
  .btn-copy {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-size: 12px;
    padding: 6px 10px; cursor: pointer;
  }
  .btn-copy.copied { border-color: var(--success); color: var(--success); }
  .result-text {
    font-size: 14px; line-height: 1.8; color: var(--text);
    white-space: pre-wrap; background: var(--surface2);
    border-radius: 8px; padding: 14px;
    max-height: 400px; overflow-y: auto;
  }
  .model-status {
    font-size: 12px; margin-top: 10px; padding: 8px 12px;
    border-radius: 8px; display: none;
  }
  .model-status.show { display: block; }
  .model-status.loading { background: rgba(108,143,255,0.1); color: var(--accent); border: 1px solid rgba(108,143,255,0.25); }
  .model-status.ready { background: rgba(52,211,153,0.1); color: var(--success); border: 1px solid rgba(52,211,153,0.25); }
  .model-status.error { background: rgba(248,113,113,0.1); color: var(--danger); border: 1px solid rgba(248,113,113,0.25); }
  .log-wrap {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px;
    margin-top: 10px; max-height: 160px; overflow-y: auto;
  }
  .log-line { font-size: 11px; color: var(--text2); font-family: monospace; margin-bottom: 3px; }
  .log-line.ok { color: var(--success); }
  .log-line.err { color: var(--danger); }
  .log-line.warn { color: var(--warn); }
</style>
</head>
<body>
<header>
  <h1>🎙 ローカル文字起こし</h1>
  <p>完全オフライン処理 — 音声データは外部に送信されません</p>
</header>
<div class="card">
  <div class="card-title">🤖 モデル選択</div>
  <div class="model-btns">
    <button class="model-btn selected" data-model="Xenova/whisper-small" onclick="selectModel(this)">
      <div class="model-name">Whisper Small</div>
      <div class="model-desc">約150MB・速い・日本語OK</div>
    </button>
    <button class="model-btn" data-model="Xenova/whisper-medium" onclick="selectModel(this)">
      <div class="model-name">Whisper Medium</div>
      <div class="model-desc">約450MB・高精度・遅め</div>
    </button>
  </div>
  <div class="model-status" id="modelStatus"></div>
</div>
<div class="card">
  <div class="card-title">🎵 音声ファイル</div>
  <div class="file-drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
    <span>📂</span>
    <p>タップして音声ファイルを選択</p>
    <p style="font-size:11px;margin-top:4px;">AAC / M4A / MP3 / WAV 対応</p>
  </div>
  <input type="file" id="fileInput" multiple accept=".aac,.m4a,.mp3,.wav,.mp4,.ogg,.flac" onchange="addFiles(this.files)">
  <ul id="fileList"></ul>
  <div class="file-controls" id="fileControls" style="display:none;">
    <button class="btn-sm" onclick="document.getElementById('fileInput').click()">＋ 追加</button>
    <button class="btn-sm" onclick="clearAllFiles()">✕ 全削除</button>
  </div>
</div>
<button class="btn-run" id="btnRun" disabled onclick="startTranscribe()">🚀 文字起こし開始</button>
<div class="progress-wrap" id="progressWrap">
  <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
  <div class="progress-label" id="progressLabel">準備中…</div>
</div>
<div class="result-card" id="resultCard">
  <div class="result-header">
    <div class="result-title">✅ 文字起こし完了</div>
    <button class="btn-copy" onclick="copyResult()">コピー</button>
  </div>
  <div class="result-text" id="resultText"></div>
</div>
<div class="log-wrap" id="logWrap">
  <div class="log-line">待機中… ファイルを選択してください</div>
</div>
<script type="module">
import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2/dist/transformers.min.js';
env.allowLocalModels = false;
env.useBrowserCache = true;
let files = [], selectedModel = 'Xenova/whisper-small', transcriber = null, transcriptText = '', isLoading = false;
function log(msg, type='') {
  const wrap = document.getElementById('logWrap');
  const ts = new Date().toLocaleTimeString('ja-JP');
  const line = document.createElement('div');
  line.className = 'log-line' + (type ? ' ' + type : '');
  line.textContent = `[${ts}] ${msg}`;
  wrap.appendChild(line);
  wrap.scrollTop = wrap.scrollHeight;
}
function fmtSize(b) { return b > 1024*1024 ? (b/1024/1024).toFixed(2)+' MB' : (b/1024).toFixed(1)+' KB'; }
function uid() { return Math.random().toString(36).slice(2,8); }
function setProgress(pct, label) {
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = label;
}
function setModelStatus(type, msg) {
  const el = document.getElementById('modelStatus');
  if (!msg) { el.className = 'model-status'; return; }
  el.className = `model-status show ${type}`;
  el.textContent = msg;
}
window.selectModel = function(btn) {
  document.querySelectorAll('.model-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  selectedModel = btn.dataset.model;
  transcriber = null;
  setModelStatus('', '');
  log(`モデル変更: ${selectedModel}`);
};
window.addFiles = function(fileList) {
  let added = 0;
  for (const f of fileList) {
    if (files.some(x => x.name === f.name && x.size === f.size)) { log(`スキップ: ${f.name}`, 'warn'); continue; }
    files.push({ id: uid(), file: f, name: f.name, size: f.size });
    added++;
  }
  log(`${added}件追加 → 合計${files.length}件`, 'ok');
  renderFileList(); updateRunBtn();
  document.getElementById('fileInput').value = '';
};
window.removeFile = function(id) {
  files = files.filter(f => f.id !== id);
  renderFileList(); updateRunBtn();
};
window.clearAllFiles = function() {
  files = []; renderFileList(); updateRunBtn();
  document.getElementById('resultCard').classList.remove('show');
  transcriptText = '';
};
function renderFileList() {
  const ul = document.getElementById('fileList');
  const ctrl = document.getElementById('fileControls');
  ul.innerHTML = '';
  ctrl.style.display = files.length ? 'flex' : 'none';
  files.forEach(item => {
    const li = document.createElement('li');
    li.innerHTML = `<div class="file-info"><div class="file-name">${item.name}</div><div class="file-meta">${fmtSize(item.size)}</div></div><button class="file-delete" onclick="removeFile('${item.id}')">✕</button>`;
    ul.appendChild(li);
  });
}
function updateRunBtn() {
  document.getElementById('btnRun').disabled = files.length === 0 || isLoading;
}
window.startTranscribe = async function() {
  if (files.length === 0) return;
  isLoading = true; updateRunBtn();
  const btn = document.getElementById('btnRun');
  btn.textContent = '処理中…';
  document.getElementById('resultCard').classList.remove('show');
  document.getElementById('progressWrap').classList.add('show');
  transcriptText = '';
  if (!transcriber) {
    log(`モデルをロード中: ${selectedModel}`, 'warn');
    log('初回はDLに数分かかります', 'warn');
    setModelStatus('loading', `⏳ ダウンロード中… ${selectedModel}`);
    setProgress(0, 'モデルをダウンロード中…');
    try {
      transcriber = await pipeline('automatic-speech-recognition', selectedModel, {
        progress_callback: info => {
          if (info.status === 'downloading') {
            const pct = info.total ? Math.round(info.loaded / info.total * 100) : 0;
            setProgress(pct * 0.5, `モデルDL: ${pct}%`);
          }
        }
      });
      log('モデルロード完了', 'ok');
      setModelStatus('ready', `✅ 準備完了`);
    } catch(e) {
      log(`モデルロードエラー: ${e.message}`, 'err');
      setModelStatus('error', `❌ ロード失敗`);
      isLoading = false; updateRunBtn();
      btn.textContent = '🚀 文字起こし開始';
      return;
    }
  }
  const results = [];
  for (let i = 0; i < files.length; i++) {
    const item = files[i];
    setProgress(50 + Math.round(i / files.length * 50), `処理中 ${i+1}/${files.length}: ${item.name}`);
    log(`処理開始: ${item.name}`);
    try {
      const arrayBuffer = await item.file.arrayBuffer();
      const audioCtx = new AudioContext({ sampleRate: 16000 });
      const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
      const float32 = audioBuffer.getChannelData(0);
      await audioCtx.close();
      log(`デコード完了: ${audioBuffer.duration.toFixed(1)}秒`);
      log('Whisper 推論中…');
      const result = await transcriber(float32, {
        language: 'japanese', task: 'transcribe',
        chunk_length_s: 30, stride_length_s: 5,
        return_timestamps: false,
      });
      log(`✅ 完了: ${(result.text||'').slice(0,40)}…`, 'ok');
      results.push({ name: item.name, text: result.text || '' });
    } catch(e) {
      log(`❌ エラー: ${e.message}`, 'err');
      results.push({ name: item.name, text: `[エラー: ${e.message}]` });
    }
  }
  setProgress(100, '完了');
  transcriptText = results.map(r => files.length > 1 ? `【${r.name}】\n${r.text}` : r.text).join('\n\n');
  document.getElementById('resultText').textContent = transcriptText;
  document.getElementById('resultCard').classList.add('show');
  log('🎉 完了', 'ok');
  isLoading = false; updateRunBtn();
  btn.textContent = '🚀 文字起こし開始';
};
window.copyResult = async function() {
  if (!transcriptText) return;
  try { await navigator.clipboard.writeText(transcriptText); }
  catch { const ta = document.createElement('textarea'); ta.value = transcriptText; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  const btn = document.querySelector('.btn-copy');
  btn.textContent = '✅ コピー済み'; btn.classList.add('copied');
  setTimeout(() => { btn.textContent = 'コピー'; btn.classList.remove('copied'); }, 2000);
};
</script>
</body>
</html>
